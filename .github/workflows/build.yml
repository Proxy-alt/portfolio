name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — refresh GitHub stats

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READONLY_PAT }}

      # deploy dist/ to your static host
      # e.g. Cloudflare Pages, Netlify, GitHub Pages
